[theme]
base = "dark"

# Primary background — deep navy
backgroundColor = "#0d1626"

# Sidebar background — slightly darker navy
secondaryBackgroundColor = "#091322"

# All text — bright near-white
textColor = "#dde8f4"

# Widget labels, borders accent
primaryColor = "#38bdf8"

# Font
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
