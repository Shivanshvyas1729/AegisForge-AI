<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisForge AI Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <h1>AegisForge AI</h1>
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">System Ready</span>
            </div>
        </header>

        <main class="chat-container">
            <div id="chat-messages" class="chat-messages">
                <div class="message system-message">
                    <div class="avatar">⚙️</div>
                    <div class="bubble">
                        <p>Welcome to AegisForge AI. Enter your dossier processing instructions below.</p>
                    </div>
                </div>
            </div>

            <div id="approval-gate" class="approval-gate hidden">
                <h3>⚠️ Human Approval Required</h3>
                <p id="approval-message">Max retries exceeded or safety flag raised.</p>
                <input type="text" id="approval-feedback" placeholder="Enter feedback or instructions...">
                <div class="approval-actions">
                    <button id="btn-approve" class="btn btn-success">Approve & Continue</button>
                    <button id="btn-reject" class="btn btn-danger">Reject & Reroute</button>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <form id="chat-form" class="chat-input-area">
                <textarea id="user-input" placeholder="E.g., Process dossier ID-9982. Extract thickness grid and run ASME calculations..." rows="1" autofocus></textarea>
                <button type="submit" id="send-btn" class="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
