<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #0b132b; }
      .grid { stroke: #1c2541; stroke-width: 0.5; }
      .border-box { fill: none; stroke: #48cae4; stroke-width: 2; }
      .title-text { font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; fill: #caf0f8; }
      .meta-text { font-family: 'Courier New', monospace; font-size: 11px; fill: #90e0ef; }
      .process-line { stroke: #00f5d4; stroke-width: 3.5; fill: none; stroke-linecap: round; }
      .utility-line { stroke: #f72585; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
      .signal-line { stroke: #ffd166; stroke-width: 1.5; stroke-dasharray: 3,3; fill: none; }
      .equip-fill { fill: #1c2541; stroke: #48cae4; stroke-width: 2.5; }
      .valve-fill { fill: #ffb703; stroke: #000; stroke-width: 1; }
      .bubble-fill { fill: #0b132b; stroke: #ffd166; stroke-width: 1.8; }
      .bubble-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #ffd166; text-anchor: middle; }
      .equip-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #caf0f8; text-anchor: middle; }
      .tag-label { font-family: 'Courier New', monospace; font-size: 11px; fill: #00f5d4; font-weight: bold; }
    </style>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00f5d4" />
    </marker>
  </defs>

  <!-- Background Canvas (Blueprint Industrial Style) -->
  <rect width="1200" height="800" class="bg" />

  <!-- Technical Drawing Outer Border -->
  <rect x="20" y="20" width="1160" height="760" class="border-box" />
  <rect x="25" y="25" width="1150" height="750" stroke="#1c2541" stroke-width="1" fill="none" />

  <!-- Drawing Title Block (Bottom-Right) -->
  <g transform="translate(780, 670)">
    <rect x="0" y="0" width="395" height="95" fill="#1c2541" stroke="#48cae4" stroke-width="1.5" />
    <line x1="0" y1="30" x2="395" y2="30" stroke="#48cae4" stroke-width="1" />
    <line x1="0" y1="62" x2="395" y2="62" stroke="#48cae4" stroke-width="1" />
    <line x1="200" y1="30" x2="200" y2="95" stroke="#48cae4" stroke-width="1" />
    <text x="15" y="21" class="title-text" font-size="14">INDIAN OIL CORPORATION LTD - GUWAHATI</text>
    <text x="15" y="47" class="meta-text">DRAWING NO: GHR-CDU1-PID-104</text>
    <text x="15" y="58" class="meta-text">REV: 04 (APPROVED FOR DESIGN)</text>
    <text x="210" y="47" class="meta-text">UNIT: CRUDE DISTILLATION (CDU-1)</text>
    <text x="210" y="58" class="meta-text">SERVICE: FEED PRE-HEAT TRAIN</text>
    <text x="15" y="80" class="title-text" font-size="12" fill="#00f5d4">CLASSIFICATION: RESTRICTED / INTERNAL ONLY</text>
  </g>

  <!-- Drawing Header -->
  <text x="50" y="55" class="title-text" font-size="18">PIPING &amp; INSTRUMENTATION DIAGRAM (P&amp;ID)</text>
  <text x="50" y="75" class="meta-text">SYSTEM: CRUDE CHARGE PRE-HEAT EXCHANGER TRAIN &amp; DESALTER FEED</text>

  <!-- ==================== EQUIPMENT 1: CHARGE CRUDE TANK (11-TK-01) ==================== -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="90" height="150" rx="10" class="equip-fill" />
    <path d="M 0 0 Q 45 -20 90 0" fill="none" stroke="#48cae4" stroke-width="2.5" />
    <text x="45" y="70" class="equip-label">11-TK-01</text>
    <text x="45" y="88" class="meta-text" text-anchor="middle">CRUDE OIL</text>
    <text x="45" y="102" class="meta-text" text-anchor="middle">STORAGE</text>
  </g>

  <!-- ==================== EQUIPMENT 2: CHARGE PUMP (11-P-101A) ==================== -->
  <g transform="translate(240, 310)">
    <circle cx="35" cy="35" r="35" class="equip-fill" />
    <path d="M 35 0 L 70 35 L 35 70 Z" fill="#48cae4" opacity="0.4" />
    <rect x="15" y="68" width="40" height="10" fill="#48cae4" />
    <text x="35" y="100" class="equip-label">11-P-101A</text>
    <text x="35" y="115" class="meta-text" text-anchor="middle">CHARGE PUMP</text>
  </g>

  <!-- ==================== EQUIPMENT 3: SHELL & TUBE EXCHANGER (11-E-101) ==================== -->
  <g transform="translate(480, 260)">
    <rect x="0" y="0" width="160" height="80" rx="20" class="equip-fill" />
    <!-- Tube bundle representation -->
    <line x1="20" y1="20" x2="140" y2="20" stroke="#00f5d4" stroke-width="2" />
    <line x1="20" y1="40" x2="140" y2="40" stroke="#00f5d4" stroke-width="2" />
    <line x1="20" y1="60" x2="140" y2="60" stroke="#00f5d4" stroke-width="2" />
    <text x="80" y="45" class="equip-label" fill="#ffffff">11-E-101</text>
    <text x="80" y="102" class="meta-text" text-anchor="middle">CRUDE / LGO PRE-HEAT</text>
  </g>

  <!-- ==================== EQUIPMENT 4: ELECTROSTATIC DESALTER (11-V-101) ==================== -->
  <g transform="translate(760, 240)">
    <rect x="0" y="0" width="180" height="110" rx="35" class="equip-fill" />
    <!-- Grid transformers on top -->
    <rect x="40" y="-20" width="30" height="20" class="equip-fill" />
    <rect x="110" y="-20" width="30" height="20" class="equip-fill" />
    <text x="90" y="55" class="equip-label">11-V-101</text>
    <text x="90" y="72" class="meta-text" text-anchor="middle">ELECTROSTATIC</text>
    <text x="90" y="85" class="meta-text" text-anchor="middle">DESALTER</text>
  </g>

  <!-- ==================== PIPELINE: MAIN CRUDE FEED LINE ==================== -->
  <!-- Tank to Pump Suction -->
  <path d="M 150 345 L 240 345" class="process-line" marker-end="url(#arrow)" />
  <text x="175" y="335" class="tag-label">6"-CR-1001-A1A</text>

  <!-- Manual Gate Valve on Pump Suction -->
  <g transform="translate(180, 337)">
    <polygon points="0,0 16,16 16,0 0,16" class="valve-fill" />
    <line x1="8" y1="0" x2="8" y2="-6" stroke="#fff" stroke-width="1.5" />
    <line x1="3" y1="-6" x2="13" y2="-6" stroke="#fff" stroke-width="2" />
  </g>

  <!-- Pump Discharge to Exchanger -->
  <path d="M 275 310 L 275 220 L 480 220 L 480 260" class="process-line" marker-end="url(#arrow)" />
  <text x="320" y="212" class="tag-label">6"-CR-1002-A1A</text>

  <!-- Flow Control Valve (FCV-101) on Exchanger Feed -->
  <g transform="translate(380, 212)">
    <polygon points="0,0 18,16 18,0 0,16" class="valve-fill" />
    <line x1="9" y1="0" x2="9" y2="-12" stroke="#fff" stroke-width="1.5" />
    <!-- Diaphragm Actuator -->
    <path d="M -1 -12 Q 9 -22 19 -12 Z" fill="#ffd166" stroke="#000" />
    <text x="9" y="32" class="meta-text" text-anchor="middle">FCV-101</text>
  </g>

  <!-- Exchanger to Desalter -->
  <path d="M 640 300 L 760 300" class="process-line" marker-end="url(#arrow)" />
  <text x="670" y="290" class="tag-label">8"-CR-1003-A1A</text>

  <!-- Desalter Treated Crude Outlet -->
  <path d="M 940 300 L 1100 300" class="process-line" marker-end="url(#arrow)" />
  <text x="965" y="290" class="tag-label">TO HEATER 11-F-01 (10"-CR-1004)</text>

  <!-- Desalter Effluent Sour Water Bottom Drain -->
  <path d="M 850 350 L 850 480 L 1050 480" class="utility-line" marker-end="url(#arrow)" />
  <text x="860" y="470" class="meta-text" fill="#f72585">SOUR WATER TO STRIPPER (4"-SW-2001)</text>

  <!-- ==================== INSTRUMENTATION LOOPS (ISA-5.1) ==================== -->
  <!-- PT-101: Suction Pressure Transmitter -->
  <g transform="translate(190, 420)">
    <circle cx="0" cy="0" r="18" class="bubble-fill" />
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#ffd166" stroke-width="1" />
    <text x="0" y="-4" class="bubble-text">PT</text>
    <text x="0" y="10" class="bubble-text">101</text>
    <path d="M 0 -18 L 0 -75" class="signal-line" />
  </g>

  <!-- FT-101 & FIC-101: Flow Transmitter & Indicating Controller -->
  <g transform="translate(340, 130)">
    <circle cx="0" cy="0" r="18" class="bubble-fill" />
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#ffd166" stroke-width="1" />
    <text x="0" y="-4" class="bubble-text">FT</text>
    <text x="0" y="10" class="bubble-text">101</text>
    <path d="M 0 18 L 0 90" class="signal-line" />
  </g>

  <g transform="translate(390, 130)">
    <circle cx="0" cy="0" r="18" class="bubble-fill" />
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#ffd166" stroke-width="1" />
    <text x="0" y="-4" class="bubble-text">FIC</text>
    <text x="0" y="10" class="bubble-text">101</text>
    <path d="M -18 0 L -32 0" class="signal-line" />
    <path d="M 0 18 L 0 70" class="signal-line" />
  </g>

  <!-- TT-102: Temperature Transmitter on Exchanger Outlet -->
  <g transform="translate(700, 200)">
    <circle cx="0" cy="0" r="18" class="bubble-fill" />
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#ffd166" stroke-width="1" />
    <text x="0" y="-4" class="bubble-text">TT</text>
    <text x="0" y="10" class="bubble-text">102</text>
    <path d="M 0 18 L 0 100" class="signal-line" />
  </g>

  <!-- PSV-101: Pressure Safety Relief Valve on Desalter Top -->
  <g transform="translate(850, 150)">
    <!-- Relief Valve Symbol -->
    <polygon points="-8,-12 8,-12 0,0" fill="#ff0054" stroke="#fff" stroke-width="1" />
    <polygon points="0,0 -8,12 8,12" fill="#ff0054" stroke="#fff" stroke-width="1" />
    <line x1="0" y1="12" x2="0" y2="90" stroke="#00f5d4" stroke-width="2" />
    <!-- Vent Line to Flare -->
    <path d="M 8 -6 L 60 -6 L 60 -50" class="utility-line" marker-end="url(#arrow)" />
    <text x="70" y="-45" class="meta-text" fill="#ff0054">TO FLARE HEADER (FL-01)</text>
    <text x="-25" y="-18" class="meta-text" font-weight="bold" fill="#ff0054">PSV-101</text>
    <text x="-35" y="-6" class="meta-text" fill="#ff0054">SET: 12.5 BARG</text>
  </g>

  <!-- ==================== ENGINEERING NOTES / HAZOP BOX ==================== -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="540" height="210" fill="#1c2541" stroke="#48cae4" stroke-width="1" opacity="0.9" />
    <text x="15" y="25" class="title-text" font-size="12" fill="#ffd166">HAZOP &amp; OPERATIONAL SAFETY NOTES:</text>
    <text x="15" y="48" class="meta-text">1. ALL FLANGES IN CRUDE SERVICE TO BE ASME B16.5 CLASS 300 RF.</text>
    <text x="15" y="68" class="meta-text">2. FCV-101 FAILS CLOSED (FC) UPON INSTRUMENT AIR LOSS.</text>
    <text x="15" y="88" class="meta-text">3. PSV-101 RELIEVING CAPACITY SIZED FOR BLOCKED OUTLET CASE PER API 520.</text>
    <text x="15" y="108" class="meta-text">4. INTERLOCK I-101 TRIPS CHARGE PUMP 11-P-101A ON LOW-LOW SUCTION LEVEL.</text>
    <text x="15" y="128" class="meta-text">5. THERMAL RELIEF TRV INSTALLED ON TUBE BUNDLE ISOLATION BYPASS.</text>
    <text x="15" y="152" class="title-text" font-size="11" fill="#00f5d4">AI VISION VERIFICATION TARGETS:</text>
    <text x="15" y="172" class="meta-text">A. CONFIRM TAGS [PT-101], [FT-101], [FIC-101], [TT-102], [PSV-101].</text>
    <text x="15" y="192" class="meta-text">B. VERIFY PIPE LINE ID 6"-CR-1002-A1A CONNECTS PUMP TO EXCHANGER.</text>
  </g>
</svg>
