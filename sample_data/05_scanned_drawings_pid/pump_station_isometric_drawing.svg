<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <style>
      .iso-bg { fill: #0d1b2a; }
      .iso-pipe { stroke: #00b4d8; stroke-width: 4; fill: none; stroke-linecap: square; }
      .iso-weld { fill: #ff006e; stroke: #fff; stroke-width: 1; }
      .iso-text { font-family: 'Courier New', monospace; font-size: 11px; fill: #e0e1dd; font-weight: bold; }
      .dim-line { stroke: #778da9; stroke-width: 1; stroke-dasharray: 4,3; }
      .valve-symbol { fill: #ffb703; stroke: #000; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1000" height="700" class="iso-bg" />
  <rect x="15" y="15" width="970" height="670" fill="none" stroke="#415a77" stroke-width="2" />

  <!-- Title Block -->
  <g transform="translate(680, 560)">
    <rect x="0" y="0" width="290" height="110" fill="#1b263b" stroke="#778da9" stroke-width="1.5" />
    <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#00b4d8">PIPING ISOMETRIC DRAWING</text>
    <text x="15" y="48" class="iso-text">LINE: 6"-CR-1002-A1A</text>
    <text x="15" y="66" class="iso-text">AREA: 11-P-101 DISCHARGE RUN</text>
    <text x="15" y="84" class="iso-text">DESIGN CODE: ASME B31.3</text>
    <text x="15" y="100" class="iso-text" fill="#ffb703">REV: 02 (AS-BUILT)</text>
  </g>

  <!-- North Arrow Indicator -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="28" fill="#1b263b" stroke="#00b4d8" stroke-width="1.5" />
    <path d="M 0 -22 L 8 10 L 0 4 L -8 10 Z" fill="#00b4d8" />
    <text x="-4" y="-28" class="iso-text" fill="#00b4d8">N</text>
    <text x="5" y="18" class="iso-text" font-size="9">30°</text>
  </g>

  <!-- Isometric Pipe Route -->
  <!-- Start from Pump Nozzle N1: EL +102.400 -->
  <g id="isometric-pipeline">
    <!-- Flange at pump nozzle -->
    <rect x="180" y="460" width="12" height="30" fill="#e0e1dd" stroke="#000" />
    <text x="130" y="478" class="iso-text">NOZZLE N1</text>
    <text x="120" y="492" class="iso-text">EL +102.400</text>

    <!-- Pipe segment 1: Vertical Rise to EL +104.800 -->
    <path d="M 186 460 L 186 320" class="iso-pipe" />
    <circle cx="186" cy="390" r="4" class="iso-weld" />
    <text x="195" y="393" class="iso-text" fill="#ff006e">FW-01</text>

    <!-- Check Valve (Non-Return Valve) on vertical leg -->
    <g transform="translate(186, 350)">
      <polygon points="-12,-8 12,-8 0,6" class="valve-symbol" />
      <polygon points="-12,20 12,20 0,6" class="valve-symbol" />
      <text x="20" y="10" class="iso-text">NRV-101</text>
    </g>

    <!-- 90 deg Elbow at EL +104.800 -->
    <!-- Pipe segment 2: Isometric East Run 3500mm -->
    <path d="M 186 320 L 450 200" class="iso-pipe" />
    <text x="300" y="245" class="iso-text">L = 3500 mm</text>
    <circle cx="318" cy="260" r="4" class="iso-weld" />
    <text x="326" y="275" class="iso-text" fill="#ff006e">FW-02</text>

    <!-- Manual Isolation Gate Valve -->
    <g transform="translate(370, 236)">
      <polygon points="-8,-12 8,0 -8,12" class="valve-symbol" />
      <polygon points="16,-12 0,0 16,12" class="valve-symbol" />
      <text x="-5" y="-18" class="iso-text">GV-102</text>
    </g>

    <!-- Pipe segment 3: Isometric North Run 2800mm -->
    <path d="M 450 200 L 680 300" class="iso-pipe" />
    <text x="540" y="235" class="iso-text">L = 2800 mm</text>
    <circle cx="565" cy="250" r="4" class="iso-weld" />
    <text x="575" y="248" class="iso-text" fill="#ff006e">FW-03</text>

    <!-- Flow Meter Orifice Flange Assembly -->
    <g transform="translate(620, 274)">
      <rect x="-6" y="-10" width="4" height="20" fill="#fff" />
      <rect x="2" y="-10" width="4" height="20" fill="#fff" />
      <text x="-15" y="-15" class="iso-text">FE-101 (ORIFICE)</text>
    </g>

    <!-- Pipe segment 4: Vertical Drop into Exchanger Shell Nozzle S1: EL +103.100 -->
    <path d="M 680 300 L 680 430" class="iso-pipe" />
    <rect x="674" y="430" width="12" height="25" fill="#e0e1dd" stroke="#000" />
    <text x="700" y="438" class="iso-text">EXCHANGER 11-E-101</text>
    <text x="700" y="452" class="iso-text">NOZZLE S1 (EL +103.100)</text>
  </g>

  <!-- Bill of Materials (BOM) Table -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="560" height="150" fill="#1b263b" stroke="#778da9" stroke-width="1" />
    <text x="15" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#00b4d8">BILL OF MATERIALS (ASME B31.3 REFINERY PIPING)</text>
    <text x="15" y="44" class="iso-text">ITEM 1: PIPE 6" SCH 40, ASTM A106 GR.B SMLS - 7.5 METERS</text>
    <text x="15" y="62" class="iso-text">ITEM 2: 90 DEG LR ELBOW 6" SCH 40, ASTM A234 WPB - 3 NOS</text>
    <text x="15" y="80" class="iso-text">ITEM 3: WELD NECK FLANGE 6" CL 300 RF, ASTM A105 - 4 NOS</text>
    <text x="15" y="98" class="iso-text">ITEM 4: GATE VALVE 6" CL 300 RF, API 600 TRIM 8 - 1 NO</text>
    <text x="15" y="116" class="iso-text">ITEM 5: SWING CHECK VALVE 6" CL 300 RF, BS 1868 - 1 NO</text>
    <text x="15" y="134" class="iso-text" fill="#ff006e">FIELD WELDS TOTAL: 3 NOS (100% RADIOGRAPHY UW-51 REQUIRED)</text>
  </g>
</svg>
